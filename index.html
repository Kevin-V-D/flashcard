<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard with writing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="button" id="practice" class="submit" value="Practice words">
    <form class="create-card">
        <div>
            <p>Target language:</p>
            <input type="text" id="target-language">
        </div>
        <div>
            <p>translation:</p>
            <input type="text" id="translation">
        </div>
        <input type="button" id="addWord" class="submit" value="Add word">
    </form>

    <script src="script.js"></script>
</body>
</html>
